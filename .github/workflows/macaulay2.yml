name: Macaulay2 package and data

on:
  push:
    paths:
      - 'macaulay2/**'
      - 'data/**'
      - 'schema/**'
      - 'tools/**'
      - 'tests/test_macaulay2_checker.py'
      - '.github/workflows/macaulay2.yml'
  pull_request:
    paths:
      - 'macaulay2/**'
      - 'data/**'
      - 'schema/**'
      - 'tools/**'
      - 'tests/test_macaulay2_checker.py'
      - '.github/workflows/macaulay2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macaulay2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Macaulay2 and validation dependencies
        run: |
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends macaulay2 python3-jsonschema
          M2 --version
      - name: Validate portable data
        run: python3 tools/validate_publication.py --self-test
      - name: Test comparison failure detection
        run: python3 -m unittest discover -s tests -p test_macaulay2_checker.py
      - name: Check package, installation, and exact data agreement
        run: python3 tools/check_macaulay2_data.py --package-tests --output /tmp/macaulay2-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macaulay2-check
          path: /tmp/macaulay2-check.json
          if-no-files-found: ignore
